<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Patterns & Filters -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: floatOrb 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-seal {
        animation: pulseScale 3s ease-in-out infinite alternate;
        transform-origin: 1040px 190px;
      }
      .signal-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 25s linear infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      @keyframes floatOrb {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        100% { transform: translate(-50px, -30px) scale(0.9); }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.98); opacity: 0.9; }
        100% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows (Kept deep in background) -->
  <circle class="glow-orb-1" cx="200" cy="100" r="280" fill="url(#glow-cyan)" />
  <circle class="glow-orb-2" cx="950" cy="280" r="320" fill="url(#glow-purple)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Cyber/Network lines in background -->
  <path class="signal-line" d="M -50 320 Q 300 240, 600 340 T 1250 260" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />
  <path class="signal-line" d="M -50 360 Q 400 390, 800 280 T 1250 380" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" />

  <!-- Right Visual Feature: Cryptographic Attestation Shield / Seal -->
  <g class="pulse-seal" filter="url(#shadow)">
    <!-- Decorative Outer Tech Ring -->
    <circle cx="1040" cy="190" r="110" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="1040" cy="190" r="95" fill="none" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5" />

    <!-- Glass Shield Background -->
    <circle cx="1040" cy="190" r="82" fill="url(#card-grad)" stroke="url(#primary-grad)" stroke-width="2.5" />

    <!-- Cryptographic Hash Shield / Keyhole Icon -->
    <path d="M 1040 140 L 1085 160 C 1085 200, 1065 230, 1040 245 C 1015 230, 995 200, 995 160 Z" fill="rgba(15, 23, 42, 0.7)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Verified Attestation Checkmark & Certificate Seal -->
    <path d="M 1022 188 L 1035 202 L 1062 173" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Ribbon Tails -->
    <path d="M 1025 240 L 1015 265 L 1035 255 L 1040 245 Z" fill="#38bdf8" opacity="0.8" />
    <path d="M 1055 240 L 1065 265 L 1045 255 L 1040 245 Z" fill="#818cf8" opacity="0.8" />

    <!-- Seal Tech Labels -->
    <rect x="970" y="295" width="140" height="26" rx="13" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="1040" y="312" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">SHA-256 VERIFIED</text>
  </g>

  <!-- Foreground Content: Header, Subtitle, and Feature Badges -->
  <g filter="url(#shadow)">
    <!-- Top Category Tag -->
    <rect x="70" y="55" width="220" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="86" cy="70" r="4" fill="#38bdf8" />
    <text x="100" y="75" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">AWESOME ECOSYSTEM</text>

    <!-- Main Title (Strictly Foregrounded & High Contrast) -->
    <text x="70" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Document Verification &amp;
    </text>
    <text x="70" y="186" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Digital Attestation
    </text>

    <!-- Subtitle / Tagline -->
    <text x="70" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400">
      The authoritative curated catalog of enterprise SaaS solutions, self-hosted e-signature engines,
    </text>
    <text x="70" y="254" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400">
      cryptographic sealers (PAdES / CAdES / RFC 3161), and verifiable digital credential frameworks.
    </text>

    <!-- Interactive / Dynamic Feature Badges (Pills) -->
    <g transform="translate(70, 290)">
      <!-- Pill 1: E-Signature Workflows -->
      <g class="pill-hover">
        <rect x="0" y="0" width="180" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#38bdf8" />
        <text x="34" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">E-Signature Flows</text>
      </g>

      <!-- Pill 2: Cryptographic Sealing -->
      <g transform="translate(195, 0)" class="pill-hover">
        <rect x="0" y="0" width="195" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#818cf8" />
        <text x="34" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PAdES / PKCS#7 Sealing</text>
      </g>

      <!-- Pill 3: Self-Hosted & Sovereign -->
      <g transform="translate(405, 0)" class="pill-hover">
        <rect x="0" y="0" width="175" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#34d399" />
        <text x="34" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Self-Hosted Engines</text>
      </g>

      <!-- Pill 4: Verifiable Credentials -->
      <g transform="translate(595, 0)" class="pill-hover">
        <rect x="0" y="0" width="190" height="38" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#f43f5e" />
        <text x="34" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Verifiable Credentials</text>
      </g>
    </g>

    <!-- Bottom Stat / Info Bar -->
    <g transform="translate(70, 360)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        🛡️ Standards: <tspan fill="#94a3b8">ESIGN • UETA • eIDAS 2.0 • W3C VC • ISO 32000-2 (PDF 2.0)</tspan>
      </text>
    </g>
  </g>
</svg>